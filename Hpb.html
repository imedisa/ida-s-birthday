<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b20"><title>آیدا و مأموریت پیتزای فوق‌محرمانه 🐢</title><style>
:root{--bg:#101b20;--panel:#20313a;--lime:#baff58;--pink:#ff7da6;--white:#f7fff2;--muted:#b7c7c4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#365b42 0,transparent 36%),radial-gradient(circle at 90% 85%,#43305d 0,transparent 35%),var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--white);min-height:100dvh;overflow-x:hidden}.wrap{width:min(100% - 28px,760px);margin:auto;padding:20px 0 65px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:var(--muted)}.chip{border:1px solid #54705f;border-radius:30px;padding:9px 13px;background:#1c302d}.card{background:linear-gradient(155deg,#263b40,#1a2a32);border:2px solid #4b6b5b;box-shadow:0 15px 0 #0b151a,0 30px 65px #0006;border-radius:28px;padding:clamp(18px,5vw,34px);margin-top:22px;position:relative;overflow:hidden}.card:before{content:'✦';position:absolute;left:18px;top:14px;color:#baff5860;font-size:40px}h1{font-size:clamp(26px,6vw,43px);line-height:1.5;margin:10px 0}h2{font-size:clamp(21px,5vw,30px);margin:10px 0 18px}.subtitle{color:var(--muted);line-height:2;font-size:15px}.accent{color:var(--lime)}.tag{display:inline-block;background:var(--lime);color:#172518;padding:8px 13px;border-radius:10px;font-weight:bold;transform:rotate(-2deg);font-size:13px}.heroes{display:flex;justify-content:center;align-items:end;gap:clamp(5px,2vw,16px);margin:24px auto 12px;max-width:520px}.turtle{flex:1;min-width:0;position:relative;filter:drop-shadow(0 12px 4px #0004);animation:bob 3s ease-in-out infinite}.turtle:nth-child(2){animation-delay:.3s}.turtle:nth-child(3){animation-delay:.6s}.turtle:nth-child(4){animation-delay:.9s}.turtle svg{display:block;width:100%;height:auto}.turtle svg .mask{fill:var(--mask)}@keyframes bob{50%{transform:translateY(-8px)}}button{font:inherit;cursor:pointer;touch-action:manipulation}.primary{border:0;border-radius:16px;background:var(--lime);color:#192820;font-weight:900;padding:16px 22px;min-height:54px;box-shadow:0 6px 0 #639a27;transition:.15s;width:100%;margin-top:14px}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #639a27}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#33494b;border:1px solid #779085;border-radius:14px;padding:12px;color:white;font-weight:bold;min-height:48px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.choice{background:#31464a;border:2px solid #5e7774;color:white;border-radius:18px;padding:17px 10px;min-height:78px;display:grid;place-items:center;gap:7px;font-weight:bold;font-size:15px;transition:.15s}.choice:active{transform:scale(.97)}.choice.selected{border-color:var(--lime);background:#395641}.choice .emoji{font-size:31px}.progress{height:10px;border-radius:12px;background:#405355;overflow:hidden;margin-top:16px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#baff58,#75eab0);transition:width .4s}.message{border-radius:15px;padding:12px 15px;margin:16px 0 0;background:#17282c;border:1px solid #5e7774;line-height:1.9;min-height:50px}.clue{background:#14282b;border-right:4px solid var(--pink);padding:12px 15px;border-radius:12px;margin:10px 0;line-height:1.9}.hidden{display:none!important}.sequence{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;direction:ltr;margin:17px 0}.orb{width:clamp(52px,16vw,85px);aspect-ratio:1;border-radius:20px;border:3px solid #ffffff45;display:grid;place-items:center;font-size:30px;color:#172518;font-weight:900;transition:.15s}.orb.flash{transform:scale(1.13);box-shadow:0 0 0 6px #fff8,0 0 35px currentColor;filter:brightness(1.35)}.blue{background:#48a8f8}.red{background:#f66c70}.purple{background:#ba85ff}.orange{background:#ffb14f}.answerDots{letter-spacing:8px;text-align:center;min-height:30px;color:var(--lime);font-size:23px}.small{font-size:12px;color:var(--muted);line-height:1.8}.footer{text-align:center;margin-top:30px;color:#90aaa2;font-size:12px}.confetti{position:fixed;pointer-events:none;animation:fall 2.8s linear forwards;top:-30px;z-index:20}@keyframes fall{to{transform:translateY(110vh) rotate(680deg);opacity:0}}.gift{font-size:90px;text-align:center;animation:bob 2s infinite}.center{text-align:center}.pizza{font-size:48px}.stepTitle{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.num{background:var(--pink);color:#1d2023;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:900}.hint{margin-top:16px}.hint button{width:100%}.hint p{color:#ffe4a5;line-height:1.9}.note{background:#3a3140;border:1px dashed #d19ec2;padding:13px;border-radius:14px;margin:16px 0;line-height:1.9}a.primary{display:block;text-align:center;text-decoration:none}.names{color:#b5d7bc;font-size:12px;text-align:center}@media(max-width:380px){.wrap{width:calc(100% - 18px)}.card{padding:16px;border-radius:22px}.choice{font-size:13px;padding:12px 6px}.top{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><header class="top"><span class="chip">🐢 پرونده محرمانه: AIDA</span><span class="chip" id="stepBadge">مرحله ۰ از ۳</span></header><div class="progress"><span id="bar"></span></div><section class="card" id="screen"></section><footer class="footer">ساخته شده برای آیدا، نینجای رسمی پیتزاها 🍕💚</footer></main><script>
// لینک ویدیوی نهایی را اینجا جایگزین کن:
const VIDEO_URL='https://drive.google.com/file/d/1VdUfngfIts82c6yDrH40zLvytlHlza-z/view?usp=drivesdk';
const screen=document.getElementById('screen'),badge=document.getElementById('stepBadge'),bar=document.getElementById('bar');let stage=0,tries=0,selected=null,maskAnswers=[],memoryInput=[],memorySequence=[2,0,3,1,2],showing=false;
const turtles=[['لئوناردو','#48a8f8'],['رافائل','#f66c70'],['دوناتلو','#ba85ff'],['مایکل‌آنجلو','#ffb14f']];
function turtle(name,color){return `<div class="turtle" style="--mask:${color}"><svg viewBox="0 0 140 170" role="img" aria-label="تصویر کارتونی بدون پس‌زمینه ${name}"><ellipse cx="70" cy="146" rx="40" ry="16" fill="#234b2b"/><path d="M38 107 Q17 88 35 62 Q70 27 105 62 Q123 90 103 108L100 145H40Z" fill="#418f47" stroke="#193b27" stroke-width="5"/><ellipse cx="70" cy="83" rx="42" ry="46" fill="#65bc55" stroke="#286b35" stroke-width="4"/><path d="M29 69 Q70 57 111 69L109 92Q70 83 31 92Z" class="mask"/><path d="M106 73L135 61 117 88Z" class="mask"/><ellipse cx="54" cy="79" rx="8" ry="11" fill="white"/><ellipse cx="86" cy="79" rx="8" ry="11" fill="white"/><ellipse cx="56" cy="80" rx="3" ry="6" fill="#18241b"/><ellipse cx="84" cy="80" rx="3" ry="6" fill="#18241b"/><path d="M53 110Q70 122 87 110" fill="none" stroke="#27572b" stroke-width="5" stroke-linecap="round"/><path d="M34 124L13 138M106 124L127 138" stroke="#60b850" stroke-width="14" stroke-linecap="round"/><path d="M53 142L48 161M87 142L92 161" stroke="#60b850" stroke-width="16" stroke-linecap="round"/><path d="M50 125H90" stroke="#d4a758" stroke-width="9"/></svg></div>`}
function hero(){return `<div class="heroes">${turtles.map(x=>turtle(...x)).join('')}</div>`}
function setStage(n){stage=n;tries=0;selected=null;badge.textContent=`مرحله ${Math.min(n,3)} از ۳`;bar.style.width=`${Math.min(n,3)/3*100}%`;render();window.scrollTo({top:0,behavior:'smooth'})}
function msg(s){document.getElementById('msg').textContent=s}function boom(){for(let i=0;i<42;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['🍕','🐢','💚','🎉','✨'][i%5];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.8+'s';e.style.fontSize=14+Math.random()*17+'px';document.body.append(e);setTimeout(()=>e.remove(),3800)}}
function render(){if(stage===0){screen.innerHTML=`<span class="tag">TOP SECRET • BIRTHDAY EDITION</span><h1>آیداااا! 🐢<br><span class="accent">تولدت مبارک نینجای من!</span></h1><p class="subtitle">فکر کردی کادوت رو همین‌جوری می‌دیم دستت؟ 😂 چهار تا لاک‌پشت اومدن سر راهت و گفتن اول باید سه مأموریت رو رد کنی. نگران نباش، از پسش برمیای... احتمالاً 😌</p>${hero()}<div class="note">🍕 قانون مهم: حق داری اشتباه کنی، ولی لاک‌پشتا حق دارن یه کوچولو بهت بخندن.</div><button class="primary" onclick="setStage(1)">بزن بریممم، کادوم کو؟ 🎁</button>`;return}
if(stage===1){screen.innerHTML=`<div class="stepTitle"><span class="num">۱</span><span class="tag">عملیات پیتزای گمشده</span></div><h2>پیتزای مخصوص رو پیدا کن 🍕</h2><p class="subtitle">مایکی سفارش رو گم کرده (بازم؟ 😭). فقط یکی از پیتزاها با هر سه سرنخ جور درمیاد:</p><div class="clue">۱. پیتزا <b>قارچ</b> داره.</div><div class="clue">۲. هیچ چیز <b>گوشتی</b> روش نیست.</div><div class="clue">۳. علاوه بر قارچ، <b>زیتون</b> هم داره.</div><div class="grid">${[['قارچ و پپرونی','🍄'],['پنیر و زیتون','🫒'],['قارچ و زیتون','🍕'],['قارچ و مرغ','🍗']].map((x,i)=>`<button class="choice" onclick="checkPizza(${i})"><span class="emoji">${x[1]}</span>${x[0]}</button>`).join('')}</div><div class="message" id="msg">آیدا خانوم، چشماتو تیز کن! 👀</div><div class="hint"><button class="secondary" onclick="msg('راهنمایی نینجایی: باید هم قارچ داشته باشه هم زیتون، بدون گوشت! 🍄🫒')">یه راهنمایی کوچولو 🥺</button></div>`;return}
if(stage===2){maskAnswers=[];screen.innerHTML=`<div class="stepTitle"><span class="num">۲</span><span class="tag">کد ماسک‌های نینجایی</span></div><h2>ماسک‌ها قاطی شدن! 🎭</h2><p class="subtitle">رنگ ماسک این چهار نفر رو به ترتیب انتخاب کن: <b>دوناتلو ← مایکل‌آنجلو ← لئوناردو ← رافائل</b>. هر بار یه رنگ بزن؛ حواست باشه اینجا دیگه شانسی جواب نمی‌ده 😏</p>${hero()}<div class="answerDots" id="dots">○ ○ ○ ○</div><div class="sequence">${[['blue','🔵'],['red','🔴'],['purple','🟣'],['orange','🟠']].map((x,i)=>`<button class="orb ${x[0]}" aria-label="${['آبی','قرمز','بنفش','نارنجی'][i]}" onclick="maskPick(${i})">${x[1]}</button>`).join('')}</div><button class="secondary" onclick="maskAnswers=[];drawDots();msg('پاک شد! از اول بچین نینجای من 🐢')">پاک کردن انتخاب‌ها ↺</button><div class="message" id="msg">چهار رنگ، چهار فرصت برای درخشیدن مغز آیدا ✨</div><div class="hint"><button class="secondary" onclick="msg('راهنمایی: دوناتلو بنفشه، مایکی نارنجی، لئو آبی، رافائل قرمز 💜🧡💙❤️')">کمک از استاد اسپلینتر 🐀</button></div>`;return}
if(stage===3){screen.innerHTML=`<div class="stepTitle"><span class="num">۳</span><span class="tag">چالش حافظه نینجایی</span></div><h2>قفل آخر، آیدااا! ⚡</h2><p class="subtitle">پنج چراغ به ترتیب روشن می‌شن. خوب نگاه کن و همون ترتیب رو تکرار کن. یه کم تمرکز لازم داره، فقط یه کم! 🧠</p><div class="sequence" id="lights">${['blue','red','purple','orange'].map((x,i)=>`<button id="light${i}" class="orb ${x}" aria-label="چراغ ${i+1}" onclick="memoryPick(${i})" disabled>${['💙','❤️','💜','🧡'][i]}</button>`).join('')}</div><div class="answerDots" id="dots">○ ○ ○ ○ ○</div><button id="play" class="primary" onclick="playSequence()">👀 نشونم بده!</button><div class="message" id="msg">وقتی آماده بودی دکمه رو بزن، خانوم نینجا!</div><div class="hint"><button class="secondary" onclick="playSequence()">دوباره نشون بده 🔁</button></div>`;return}
if(stage===4){badge.textContent='مأموریت انجام شد!';bar.style.width='100%';screen.innerHTML=`<span class="tag">MISSION COMPLETE</span><div class="gift">🎁</div><h1 class="center">آیدااااااا! 🎂💚</h1><h2 class="center accent">تولدت مبارک، نینجای خوشگل!</h2><p class="subtitle center">تبریک! هم پیتزا رو نجات دادی، هم ماسک‌ها رو جور کردی، هم مغزتو به کار انداختی 😂 حالا دیگه حقته سورپرایزتو ببینی. دوستت داریم، خیلی زیادددد! 🐢🍕</p>${hero()}<a class="primary" href="${VIDEO_URL}" target="_blank" rel="noopener noreferrer">🎬 کادوی مخفیمو باز کنننن!</a><p class="small center">اگه ویدیو باز نشد، دسترسی فایل در گوگل‌درایو باید روی Anyone with the link تنظیم شده باشه.</p><button class="secondary" style="width:100%;margin-top:12px" onclick="setStage(0)">یه دور دیگه بازی کنم؟ ↻</button>`;boom()}}
function checkPizza(i){if(i===2){msg('آفریننن! مایکی پیتزاشو پیدا کرد! 🍕💚');boom();setTimeout(()=>setStage(2),1100)}else{tries++;msg(['نههه آیدا 😂 یه بار دیگه سرنخ‌ها رو بخون!','پیتزا داره بهت نگاه می‌کنه و قضاوتت می‌کنه 😭','تمرکز کن نینجای کوچولو! 🍄🫒'][Math.min(tries-1,2)])}}
function drawDots(){let el=document.getElementById('dots');if(el)el.textContent=maskAnswers.map(i=>['🔵','🔴','🟣','🟠'][i]).join(' ')+' ○'.repeat(4-maskAnswers.length)}
function maskPick(i){maskAnswers.push(i);drawDots();if(maskAnswers.length===4){if(maskAnswers.join(',')==='2,3,0,1'){msg('واااای آیدا! استاد اسپلینتر بهت افتخار می‌کنه 🐢');boom();setTimeout(()=>setStage(3),1250)}else{msg('اوپسسس! یکی از رنگا قاطی شده 😂 دوباره امتحان کن!');maskAnswers=[];setTimeout(drawDots,750)}}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function playSequence(){if(showing)return;showing=true;memoryInput=[];let play=document.getElementById('play');play.disabled=true;document.querySelectorAll('.orb').forEach(b=>b.disabled=true);document.getElementById('dots').textContent='👀 خوب نگاه کن...';msg('شششش! نینجا در حال حفظ کردنه 🤫');await sleep(550);for(let i of memorySequence){let el=document.getElementById('light'+i);el.classList.add('flash');await sleep(630);el.classList.remove('flash');await sleep(320)}showing=false;document.querySelectorAll('.orb').forEach(b=>b.disabled=false);play.disabled=false;document.getElementById('dots').textContent='○ ○ ○ ○ ○';msg('حالا نوبت توئه! ترتیب رو بزن 🐢')}
function memoryPick(i){if(showing||!document.getElementById('play')||document.getElementById('play').disabled)return;memoryInput.push(i);document.getElementById('dots').textContent='● '.repeat(memoryInput.length)+'○ '.repeat(5-memoryInput.length);if(memoryInput[memoryInput.length-1]!==memorySequence[memoryInput.length-1]){msg('اوه نههه 😭 این یکی نبود! دوباره دنباله رو ببین.');memoryInput=[];document.getElementById('dots').textContent='○ ○ ○ ○ ○';return}if(memoryInput.length===memorySequence.length){msg('آیدا رسماً نینجای افسانه‌ای شددد! 🎉');document.querySelectorAll('.orb').forEach(b=>b.disabled=true);setTimeout(()=>setStage(4),1200)}}
render();
</script></body></html>
